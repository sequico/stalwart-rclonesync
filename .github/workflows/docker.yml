name: Docker

# Publishes a pre-built image to GHCR on every v* tag, so users can
# `docker pull ghcr.io/sequico/stalwart-rclonesync:<version>` instead of
# building it themselves. CI (ci.yml) already builds the image on every
# push/PR; this workflow only runs for releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/sequico/stalwart-rclonesync
          TAG=${GITHUB_REF_NAME#v}  # v0.3.1 -> 0.3.1
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
      # Note: the package is automatically public because the repository is
      # public; change visibility in the package settings if that ever varies.
