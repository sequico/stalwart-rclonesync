[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stalwart-rclonesync"
description = "Two-way, state-driven file mirror between any two rclone remotes (Stalwart WebDAV Files, pCloud, S3, SFTP, ...). No rclone bisync mtime ping-pong."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# The version lives in ONE place: VERSION in stalwart_rclonesync.py.
dynamic = ["version"]
authors = [{ name = "sequico", email = "sequico@users.noreply.github.com" }]
keywords = ["stalwart", "pcloud", "webdav", "rclone", "sync", "two-way", "mirror", "mail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: System :: Archiving :: Mirroring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
stalwart-rclonesync = "stalwart_rclonesync:main"

[tool.setuptools]
py-modules = ["stalwart_rclonesync"]

[tool.setuptools.dynamic]
version = { attr = "stalwart_rclonesync.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
